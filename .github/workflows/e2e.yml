name: End-to-end

on:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install backend
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install browsers
        working-directory: e2e
        run: |
          npm ci
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install-deps chromium
          fi
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Migrate, seed and start backend
        working-directory: backend
        env:
          JWT_SECRET: synthetic-e2e-secret
          SEED_DEMO_DATA: "true"
          DATABASE_URL: sqlite:///./e2e.db
          AI_PROVIDER: ollama
        run: |
          export FIELD_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          alembic upgrade head
          python -m seed.load
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          curl --retry 30 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:8000/health
      - name: Run Playwright
        working-directory: e2e
        env:
          BASE_URL: http://127.0.0.1:8000
          E2E_CLIENT_EMAIL: client.active@example.test
          E2E_CLIENT_PASSWORD: demo-password
          E2E_INACTIVE_EMAIL: client.inactive@example.test
          E2E_INACTIVE_PASSWORD: demo-password
          E2E_VOLUNTEER_EMAIL: volunteer@example.test
          E2E_VOLUNTEER_PASSWORD: demo-password
          E2E_WAREHOUSE_STAFF_EMAIL: warehouse.staff@example.test
          E2E_WAREHOUSE_STAFF_PASSWORD: demo-password
          E2E_WAREHOUSE_MANAGER_EMAIL: warehouse.manager@example.test
          E2E_WAREHOUSE_MANAGER_PASSWORD: demo-password
          E2E_DIRECTOR_EMAIL: director@example.test
          E2E_DIRECTOR_PASSWORD: demo-password
        run: npx playwright test
