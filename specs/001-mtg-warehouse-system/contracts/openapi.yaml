      parameters: [{ name: date_from, in: query, schema: { type: string, format: date } }, { name: date_to, in: query, schema: { type: string, format: date } }, { name: attributed, in: query, schema: { type: string, enum: [donor, grant] } }, { name: donor_id, in: query, schema: { type: integer } }, { name: grant_id, in: query, schema: { type: integer } }, { name: category, in: query, schema: { type: string } }, { name: household_min, in: query, schema: { type: integer, minimum: 1 } }, { name: household_max, in: query, schema: { type: integer, minimum: 1 } }, { name: preset, in: query, required: true, schema: { type: string, enum: [donor, grant, general] } }, { name: format, in: query, schema: { type: string, enum: [docx, pdf, both], default: docx } }]
      responses: { '200': { description: DOCX }, '422': { description: Bad filters } }
  /reports/{type}:
    post:
      summary: Generate a donor or grant report as DOCX (Warehouse Manager, Director)
      parameters: [{ name: type, in: path, required: true, schema: { type: string, enum: [donor, grant] } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { period_start: { type: string, format: date }, period_end: { type: string, format: date } } } } } }
      responses: { '200': { description: DOCX file, content: { application/vnd.openxmlformats-officedocument.wordprocessingml.document: { schema: { type: string, format: binary } } } } }
  /health:
    get: { summary: Liveness and AI availability, security: [], responses: { '200': { description: OK } } }
