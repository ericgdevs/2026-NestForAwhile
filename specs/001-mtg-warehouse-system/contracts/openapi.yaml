openapi: 3.1.0
info:
  title: NestForAwhile MTG Warehouse API
  version: 0.1.0
  description: Contract boundary for generated TypeScript types. Roles are enforced server-side.
servers:
  - url: /api
security:
  - cookieAuth: []
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: session }
  schemas:
    Role: { type: string, enum: [Client, Volunteer, Warehouse Staff, Warehouse Manager, Director] }
    SafetyStatus: { type: string, enum: [Approved, Capped, Restricted], description: "Green / Yellow / Red. Set only by the rules engine." }
    Error:
      type: object
      required: [detail]
      properties: { detail: { type: string } }
    LoginRequest:
      type: object
      required: [email, password]
      properties: { email: { type: string }, password: { type: string } }
    LoginResult:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        Shopping_Session_Token: { type: string, nullable: true }
        Client_Enrollment_Status: { type: string, enum: [Active, Inactive, Pending] }
        queue: { $ref: '#/components/schemas/QueueState' }
    QueueState:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [waiting, ready, claimed, expired, cancelled] }
        position: { type: integer, nullable: true }
        message: { type: string }
    Capacity:
      type: object
      required: [Active_Floor_Shoppers, Max_Floor_Capacity, Queue_Waiting]
      properties:
        Active_Floor_Shoppers: { type: integer }
        Max_Floor_Capacity: { type: integer, minimum: 1 }
        Queue_Waiting: { type: integer }
    DietaryProfile:
      type: object
      required: [restrictions, allergies]
      properties:
        restrictions: { type: array, items: { type: string } }
        allergies: { type: array, items: { type: string } }
        preferences: { type: array, items: { type: string } }
        Dietary_Tier_ID: { type: integer, readOnly: true }
    HouseholdMember:
      type: object
      description: One person in the household, by nickname. `conditions` (ICD-10) is returned only to the client themselves.
      required: [nickname, restrictions, allergies]
      properties:
        nickname: { type: string, maxLength: 40 }
        age: { type: integer, nullable: true, minimum: 0, maximum: 120 }
        restrictions: { type: array, items: { type: string } }
        allergies: { type: array, items: { type: string } }
        conditions: { type: array, items: { type: string }, description: 'ICD-10 codes from the encrypted Client_Medical_Profile' }
    HouseholdMemberInput:
      type: object
      properties:
        nickname: { type: string, maxLength: 40, description: 'Defaults to "Person N"' }
        age: { type: integer, nullable: true, minimum: 0, maximum: 120 }
        restrictions: { type: array, items: { type: string } }
        allergies: { type: array, items: { type: string } }
        conditions:
          type: array
          maxItems: 20
          items: { type: string, enum: [E11, I10, I25, N18, K90.0] }
          description: Optional ICD-10 codes. Stored encrypted in Client_Medical_Profile and mapped to dietary choices and Dietary_Tier_ID by the rules matrix.
    SignupRequest:
      type: object
      required: [email, password, name, members]
      properties:
        email: { type: string }
        password: { type: string, minLength: 8 }
        name: { type: string, description: Real name, shown only on the manager approval screen }
        members: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/HouseholdMemberInput' } }
    PendingClient:
      type: object
      properties:
        client_id: { type: integer }
        name: { type: string }
        Household_Size: { type: integer }
        created_at: { type: string, format: date-time }
    Client:
      type: object
      properties:
        client_id: { type: integer }
        members: { type: array, items: { $ref: '#/components/schemas/HouseholdMember' } }
        Household_Size: { type: integer, minimum: 1 }
        Client_Enrollment_Status: { type: string, enum: [Active, Inactive, Pending] }
        profile: { $ref: '#/components/schemas/DietaryProfile' }
    Nutrition:
      type: object
      properties:
        serving_size_g: { type: number, nullable: true }
        calories: { type: number, nullable: true }
        sodium_mg: { type: number, nullable: true }
        sugar_g: { type: number, nullable: true }
        sat_fat_g: { type: number, nullable: true }
        fiber_g: { type: number, nullable: true }
        protein_g: { type: number, nullable: true }
        carbs_g: { type: number, nullable: true }
        total_fat_g: { type: number, nullable: true }
        trans_fat_g: { type: number, nullable: true }
        cholesterol_mg: { type: number, nullable: true }
        vitamin_d_mcg: { type: number, nullable: true }
        calcium_mg: { type: number, nullable: true }
        iron_mg: { type: number, nullable: true }
        added_sugar_g: { type: number, nullable: true }
        potassium_mg: { type: number, nullable: true }
    NotFor:
      type: object
      description: A household member a product is restricted for, by nickname (never a real name).
      required: [nickname, reason]
      properties:
        nickname: { type: string }
        reason: { type: string }
    Swap:
      type: object
      description: A safer in-stock product in the same category, chosen by rules (never AI)
      properties:
        product_id: { type: integer }
        name: { type: string }
        status: { $ref: '#/components/schemas/SafetyStatus' }
        not_for: { type: array, items: { $ref: '#/components/schemas/NotFor' } }
        aisle: { type: string }
        shelf: { type: string }
        bin: { type: string }
    SavedRecipe:
      allOf:
        - $ref: '#/components/schemas/Recipe'
        - type: object
          properties: { id: { type: integer } }
    ProductResult:
      type: object
      required: [name, status, explanation]
      properties:
        product_id: { type: integer }
        name: { type: string }
        image_url: { type: string, nullable: true }
        nutrition: { $ref: '#/components/schemas/Nutrition' }
        status: { $ref: '#/components/schemas/SafetyStatus' }
        explanation: { type: string }
        not_for: { type: array, items: { $ref: '#/components/schemas/NotFor' } }
        allergy_match: { type: boolean }
        swaps: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/Swap' }, description: Only when status is Restricted }
        in_stock: { type: boolean }
    Recommendation:
      type: object
      required: [product_id, name, suggested_qty, rationale, status]
      properties:
        product_id: { type: integer }
        name: { type: string }
        suggested_qty: { type: integer, minimum: 1 }
        rationale: { type: string }
        status: { $ref: '#/components/schemas/SafetyStatus' }
        not_for: { type: array, items: { $ref: '#/components/schemas/NotFor' } }
        allergy_match: { type: boolean }
    CartItem:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: { type: integer }
        name: { type: string }
        quantity: { type: integer, minimum: 1 }
        from_recommendation: { type: boolean }
        status: { $ref: '#/components/schemas/SafetyStatus' }
        explanation: { type: string }
        not_for: { type: array, items: { $ref: '#/components/schemas/NotFor' } }
        allergy_match: { type: boolean }
        sku: { type: string }
        sodium_mg: { type: number, nullable: true }
        sugar_g: { type: number, nullable: true }
        sat_fat_g: { type: number, nullable: true }
        potassium_mg: { type: number, nullable: true }
        calories: { type: number, nullable: true }
        carbs_g: { type: number, nullable: true }
        serving_size_g: { type: number, nullable: true }
        total_fat_g: { type: number, nullable: true }
        trans_fat_g: { type: number, nullable: true }
        cholesterol_mg: { type: number, nullable: true }
        fiber_g: { type: number, nullable: true }
        added_sugar_g: { type: number, nullable: true }
        protein_g: { type: number, nullable: true }
        vitamin_d_mcg: { type: number, nullable: true }
        calcium_mg: { type: number, nullable: true }
        iron_mg: { type: number, nullable: true }
    Cart:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
    Recipe:
      type: object
      required: [title, steps, ingredients]
      properties:
        cuisine: { type: string, nullable: true, maxLength: 30 }
        title: { type: string }
        steps: { type: array, items: { type: string } }
        ingredients:
          type: array
          items:
            type: object
            required: [name, in_cart_or_stock]
            properties:
              name: { type: string }
              product_id: { type: integer, nullable: true }
              in_cart_or_stock: { type: boolean }
              location: { type: object, nullable: true, properties: { aisle: { type: string }, shelf: { type: string }, bin: { type: string } } }
    RecipeResponse:
      type: object
      properties:
        recipes: { type: array, items: { $ref: '#/components/schemas/Recipe' } }
        missing_ingredients:
          type: array
          items:
            type: object
            properties:
              product_id: { type: integer }
              name: { type: string }
              reason: { type: string }
              location: { type: object, properties: { aisle: { type: string }, shelf: { type: string }, bin: { type: string } } }
        used_fallback: { type: boolean }
    CheckoutResult:
      type: object
      properties:
        status: { type: string, enum: [completed, blocked] }
        blocked_items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
        receipt_id: { type: integer, nullable: true }
    CheckoutReview:
      type: object
      description: What the volunteer sees; complete is refused while blocking or needs_ack is non-empty
      properties:
        Shopping_Session_Token: { type: string }
        client_id: { type: integer }
        Client_Enrollment_Status: { type: string, enum: [Active, Inactive, Pending] }
        items:
          type: array
          items:
            type: object
            properties:
              product_id: { type: integer }
              name: { type: string }
              quantity: { type: integer }
              status: { $ref: '#/components/schemas/SafetyStatus' }
              not_for: { type: array, items: { $ref: '#/components/schemas/NotFor' } }
              allergy_match: { type: boolean }
              acknowledged: { type: boolean }
              overridden: { type: boolean }
        blocking: { type: array, items: { type: string }, description: 'Red items, Pending account, stock' }
        needs_ack:
          type: array
          items:
            type: object
            properties:
              product_id: { type: integer }
              name: { type: string }
              not_for: { type: array, items: { $ref: '#/components/schemas/NotFor' } }
    ShoppingListLine:
      type: object
      properties:
        id: { type: integer }
        text: { type: string }
        product_id: { type: integer, nullable: true }
        name: { type: string }
        source: { type: string, enum: [you, recipe] }
        recipes: { type: array, items: { $ref: '#/components/schemas/Recipe' }, description: 'Every recipe this line is for; one line per product (or free-text item)' }
        ticked: { type: boolean }
        in_stock: { type: boolean }
        location: { type: object, nullable: true, properties: { aisle: { type: string }, shelf: { type: string }, bin: { type: string } } }
        status: { $ref: '#/components/schemas/SafetyStatus' }
        not_for: { type: array, items: { $ref: '#/components/schemas/NotFor' } }
    VisitState:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [awaiting_approval, inactive, shopping, queued, complete, none] }
        Shopping_Session_Token: { type: string, description: 'When shopping' }
        queue_status: { type: string, enum: [waiting, ready], description: 'When queued' }
        position: { type: integer, nullable: true }
        message: { type: string }
        receipt:
          type: object
          description: 'When complete (checkout in the last 12 hours)'
          properties:
            checkout_id: { type: integer }
            total_lb: { type: number }
            completed_at: { type: string, format: date-time }
    AuditSubmit:
      type: object
      required: [product_id, counted_qty]
      properties: { product_id: { type: integer }, counted_qty: { type: integer, minimum: 0 } }
    AuditResult:
      type: object
      properties: { expected_qty: { type: integer }, counted_qty: { type: integer }, variance: { type: integer } }
    ReplenishmentItem:
      type: object
      properties:
        product_id: { type: integer }
        name: { type: string }
        quantity: { type: integer }
        reorder_threshold: { type: integer }
        aisle: { type: string }
        shelf: { type: string }
        bin: { type: string }
        priority: { type: integer }
    Lot:
      type: object
      properties:
        lot_id: { type: integer }
        product_id: { type: integer }
        quantity: { type: integer }
        expiration_date: { type: string, format: date }
        expiring_soon: { type: boolean }
    Analytics:
      type: object
      properties:
        families_served: { type: integer }
        visits_completed: { type: integer }
        pounds_distributed: { type: number }
        inventory_usage: { type: integer }
        recommendation_adoption_rate: { type: number }
        waste_reduction: { type: object, properties: { expiring_soon_lots: { type: integer }, pounds_saved: { type: number } } }
paths:
  /auth/login:
    post:
      summary: Log in; starts a shopping session for Active clients if the floor has room, otherwise joins the queue. Pending clients sign in with no session (awaiting approval); Inactive is rejected.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResult' } } } }
        '401': { description: Invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Enrollment not Active, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/logout:
    post: { summary: Log out and end the session, responses: { '204': { description: Done } } }
  /auth/signup:
    post:
      summary: Self sign-up; creates a Pending client household. No shopping session until a Warehouse Manager approves it (Epic 1).
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SignupRequest' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResult' } } } }
        '409': { description: Email already registered }
        '422': { description: Unknown dietary choice or condition }
  /me/household:
    get: { summary: My household members (Client), responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { members: { type: array, items: { $ref: '#/components/schemas/HouseholdMember' } } } } } } } } }
    put:
      summary: Replace my household members (Client); keeps Household_Size and Dietary_Tier_ID in step
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [members], properties: { members: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/HouseholdMemberInput' } } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { members: { type: array, items: { $ref: '#/components/schemas/HouseholdMember' } } } } } } } }
  /clients/pending:
    get: { summary: Pending clients waiting for approval, with real name (Warehouse Manager), responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PendingClient' } } } } } } }
  /clients/{client_id}/approve:
    post:
      summary: Approve a pending client (Warehouse Manager); records who approved and when
      parameters: [{ name: client_id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: Approved }, '404': { description: No pending client } }
  /me:
    get: { summary: Current user, role, and client profile, responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Client' } } } } } }
  /me/profile:
    put:
      summary: Save dietary restrictions, allergies, preferences (Client). Server assigns Dietary_Tier_ID.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DietaryProfile' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DietaryProfile' } } } } }
  /queue/me:
    get: { summary: My queue state (Client), responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/QueueState' } } } } } }
    post: { summary: Confirm I am here when my turn is ready (Client), responses: { '200': { description: Session created, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResult' } } } }, '409': { description: Claim window expired } } }
  /capacity:
    get: { summary: Floor counts (Volunteer, Warehouse Staff, Warehouse Manager), responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Capacity' } } } } } }
    put:
      summary: Set Max_Floor_Capacity (Warehouse Manager)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [Max_Floor_Capacity], properties: { Max_Floor_Capacity: { type: integer, minimum: 1 } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Capacity' } } } } }
  /recommendations:
    get: { summary: In-stock, rules-approved recommendations for my session (Client), responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Recommendation' } } } } } } }
  /products/scan/{code}:
    get:
      summary: Barcode or SKU lookup with safety status (Client)
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProductResult' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /cart:
    get: { summary: Live cart (Client), responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } } } }
  /cart/items:
    post:
      summary: Add an item (Client)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CartItem' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } } }
  /cart/items/{product_id}:
    parameters: [{ name: product_id, in: path, required: true, schema: { type: integer } }]
    patch:
      summary: Change quantity (Client)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [quantity], properties: { quantity: { type: integer, minimum: 1 } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } } }
    delete: { summary: Remove an item (Client), responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } } } }
  /recipes:
    post:
      summary: Inventory-aware recipes from the scanned item, Active_Cart_Manifest, and current inventory (Client)
      requestBody: { content: { application/json: { schema: { type: object, properties: { scanned_product_id: { type: integer, nullable: true, description: 'Every recipe uses this item; none are returned if it is restricted for any household member' }, cuisine: { type: string, nullable: true, maxLength: 30 } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RecipeResponse' } } } } }
  /me/recipes:
    get: { summary: My saved recipes, newest first (Client), responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SavedRecipe' } } } } } } }
    post:
      summary: Save a recipe as shown (Client)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Recipe' } } } }
      responses: { '201': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/SavedRecipe' } } } } }
  /me/recipes/{recipe_id}:
    delete:
      summary: Delete one of my saved recipes (Client)
      parameters: [{ name: recipe_id, in: path, required: true, schema: { type: integer } }]
      responses: { '204': { description: Deleted }, '404': { description: Not found } }
  /checkout/lookup:
    get:
      summary: Load a client's cart from their QR token or client ID (Volunteer, Warehouse Manager)
      parameters:
        - { name: token, in: query, schema: { type: string } }
        - { name: client_id, in: query, schema: { type: integer } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutReview' } } } }, '404': { description: No active visit }, '422': { description: Neither given } }
  /checkout/{session_token}/items:
    post:
      summary: Volunteer scans in an item the client forgot to add (logged as volunteer_added)
      parameters: [{ name: session_token, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, description: SKU or barcode }, quantity: { type: integer, minimum: 1, default: 1 } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutReview' } } } } }
  /checkout/{session_token}/items/{product_id}:
    delete:
      summary: Volunteer removes an item (logged as removed_item)
      parameters: [{ name: session_token, in: path, required: true, schema: { type: string } }, { name: product_id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutReview' } } } } }
  /checkout/{session_token}/acknowledge:
    post:
      summary: Volunteer confirms an allergy item with the client (logged as allergy_ack)
      parameters: [{ name: session_token, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [product_id], properties: { product_id: { type: integer }, note: { type: string } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutReview' } } } }, '409': { description: No allergy check needed } }
  /checkout/{session_token}/override:
    post:
      summary: Warehouse Manager lets a Red item through with a required reason (logged as manager_override)
      parameters: [{ name: session_token, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [product_id, note], properties: { product_id: { type: integer }, note: { type: string } } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutReview' } } } } }
  /me/visit:
    get: { summary: 'Where I am in my visit: awaiting approval, queued, shopping, complete, or none (Client)', responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/VisitState' } } } } } }
  /me/check-in:
    post: { summary: 'Start (or resume) my visit without signing in again; joins the queue if the floor is full (Client)', responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/VisitState' } } } } } }
  /me/session:
    get: { summary: My active session token and client ID for the checkout QR (Client), responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { Shopping_Session_Token: { type: string }, client_id: { type: integer } } } } } }, '404': { description: No active visit } } }
  /shopping-list:
    get: { summary: My shopping list sorted by aisle (Client), responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ShoppingListLine' } } } } } } } } }
    post:
      summary: Add my own items or a recipe's ingredients; an item already on the list is updated (tagged with the recipe) instead of duplicated (Client)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { type: object, required: [text], properties: { text: { type: string }, product_id: { type: integer, nullable: true } } } }, recipe: { $ref: '#/components/schemas/Recipe' } } } } } }
      responses: { '201': { description: Added } }
  /shopping-list/{item_id}:
    patch:
      summary: Tick or untick a line; ticking an in-stock product adds one to the cart (Client)
      parameters: [{ name: item_id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ticked], properties: { ticked: { type: boolean } } } } } }
      responses: { '200': { description: OK } }
    delete:
      summary: Remove a line (Client)
      parameters: [{ name: item_id, in: path, required: true, schema: { type: integer } }]
      responses: { '204': { description: Deleted } }
  /shopping-list/parse:
    post:
      summary: Turn typed text or a list photo into suggested lines matched to stock; nothing is saved, the photo is dropped (Client)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { text: { type: string }, image_base64: { type: string }, media_type: { type: string, enum: [image/jpeg, image/png, image/webp, image/heic] } } } } } }
      responses: { '200': { description: OK }, '503': { description: Photo reading unavailable; type the list instead } }
  /checkout/{session_token}/validate:
    post:
      summary: Review checkout; hard stops for Red items and Pending accounts, allergy acknowledgements (Volunteer, Warehouse Manager)
      parameters: [{ name: session_token, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Completed or blocked, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutResult' } } } } }
  /checkout/{session_token}/interventions:
    post:
      summary: Record a volunteer intervention, such as removing a restricted item (Volunteer, Warehouse Manager)
      parameters: [{ name: session_token, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [product_id, action], properties: { product_id: { type: integer }, action: { type: string, enum: [removed_item] }, note: { type: string } } } } } }
      responses: { '200': { description: OK } }
  /inventory/audit/{code}:
    get: { summary: Scan and view current quantity (Warehouse Staff, Warehouse Manager), parameters: [{ name: code, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { product_id: { type: integer }, name: { type: string }, current_qty: { type: integer } } } } } } } }
  /inventory/audit:
    post:
      summary: Submit counted quantity; computes variance, stores audit event, updates inventory (Warehouse Staff, Warehouse Manager)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AuditSubmit' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuditResult' } } } } }
  /inventory/replenishment:
    get:
      summary: Items below threshold with aisle/shelf/bin (Warehouse Staff, Warehouse Manager)
      parameters: [{ name: sort, in: query, schema: { type: string, enum: [priority, location, name], default: priority } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ReplenishmentItem' } } } } } }
  /inventory/lots:
    get: { summary: Lots in FIFO order with expiring-soon flag (Warehouse Staff, Warehouse Manager), responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Lot' } } } } } } }
  /analytics:
    get: { summary: Anonymized operational metrics (Warehouse Manager, Director), responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Analytics' } } } } } }
  /reports/options:
    get: { summary: Donors, grants and product categories to filter by (Warehouse Manager, Director), responses: { '200': { description: OK } } }
  /reports/preview:
    get:
