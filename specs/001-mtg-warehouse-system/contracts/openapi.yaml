      parameters: [{ name: date_from, in: query, schema: { type: string, format: date } }, { name: date_to, in: query, schema: { type: string, format: date } }, { name: attributed, in: query, schema: { type: string, enum: [donor, grant] } }, { name: donor_id, in: query, schema: { type: integer } }, { name: grant_id, in: query, schema: { type: integer } }, { name: category, in: query, schema: { type: string } }, { name: household_min, in: query, schema: { type: integer, minimum: 1 } }, { name: household_max, in: query, schema: { type: integer, minimum: 1 } }]
      responses: { '200': { description: OK }, '422': { description: Bad filters } }
  /reports/export:
    get:
      summary: Every matching row as CSV or JSON (Warehouse Manager, Director)
